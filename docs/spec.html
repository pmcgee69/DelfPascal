<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delf specification</title>
<meta name="description" content="Delf's translation specification, version 0.1: what Delf adds to Delphi, and what delfc writes for each part.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  #spec h1 { margin-top: 2.4rem; }
  #spec h3 { font-size: 1.1rem; margin: 1.8rem 0 0.5rem; }
  #spec h4 { font-family: "Inter", system-ui, sans-serif; font-size: 1rem; margin: 1.4rem 0 0.4rem; }
  #spec hr { border: none; border-top: 1px solid var(--rule); margin: 2rem 0; }
  #spec .table-wrap { overflow-x: auto; margin: 1rem 0; }
  #spec table { border-collapse: collapse; font-size: 0.95rem; }
  #spec th, #spec td { border: 1px solid var(--rule); padding: 0.4rem 0.6rem; text-align: left; vertical-align: top; }
  #spec th { background: var(--code-bg); font-family: "Inter", system-ui, sans-serif; font-weight: 600; }
  #spec blockquote { border-left: 3px solid var(--rule); margin: 1rem 0; padding: 0 1rem; color: var(--muted); }
  #spec h2 a.anchor, #spec h3 a.anchor { color: var(--muted); text-decoration: none; margin-left: 0.4rem; opacity: 0; }
  #spec h2:hover a.anchor, #spec h3:hover a.anchor { opacity: 1; }
  nav.toc { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 0.8rem 1.1rem; margin: 1.5rem 0; }
  nav.toc strong { font-family: "Inter", system-ui, sans-serif; }
  nav.toc ol { margin: 0.4rem 0 0; padding-left: 1.2rem; }
  p.status { color: var(--muted); }
</style>
</head>
<body>
<header class="site">
  <a class="home" href="./">Delf</a>
  <nav><a href="./#videos">Videos</a><a href="./#articles">Articles</a><a href="./#slides">Slides</a><a href="https://github.com/pmcgee69/DelfPascal">GitHub</a></nav>
</header>
<main>
<p class="meta">Paul McGee · version 0.1 · 18 November 2026 · source: <a href="https://github.com/pmcgee69/DelfPascal/blob/main/SPEC.md">SPEC.md on GitHub</a></p>
<nav class="toc" id="toc" hidden><strong>Contents</strong><ol></ol></nav>
<article id="spec">
  <p class="status" id="loading">Loading the specification…</p>
  <noscript><p>This page draws the specification with JavaScript. Read it on GitHub instead: <a href="https://github.com/pmcgee69/DelfPascal/blob/main/SPEC.md">SPEC.md</a>.</p></noscript>
</article>
</main>
<footer class="site">Paul McGee · <a href="https://github.com/pmcgee69">github.com/pmcgee69</a></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/delphi.min.js"></script>
<script>
(async function () {
  const SRC = "https://raw.githubusercontent.com/pmcgee69/DelfPascal/main/SPEC.md";
  const GH = "https://github.com/pmcgee69/DelfPascal/blob/main/SPEC.md";
  const spec = document.getElementById("spec");
  try {
    const res = await fetch(SRC, { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status);
    const md = await res.text();
    spec.innerHTML = marked.parse(md, { gfm: true });
  } catch (e) {
    spec.innerHTML = '<p class="status">The specification couldn\'t be loaded here. Read it on GitHub: <a href="' + GH + '">SPEC.md</a>.</p>';
    return;
  }

  // Links into the private repository's files don't exist here: show them as plain text.
  spec.querySelectorAll("a[href]").forEach(a => {
    const h = a.getAttribute("href");
    if (!/^(https?:|mailto:|#)/.test(h)) a.replaceWith(...a.childNodes);
  });

  // Headings get ids and a hover anchor; section headings make the contents list.
  const used = new Set();
  const slug = t => {
    let s = t.toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu, "").trim().replace(/\s+/g, "-") || "section";
    let u = s, n = 2;
    while (used.has(u)) u = s + "-" + n++;
    used.add(u);
    return u;
  };
  const toc = document.querySelector("#toc ol");
  spec.querySelectorAll("h1, h2, h3").forEach(h => {
    h.id = slug(h.textContent);
    if (h.tagName !== "H1") {
      const a = document.createElement("a");
      a.className = "anchor"; a.href = "#" + h.id; a.textContent = "#";
      a.setAttribute("aria-label", "Link to this section");
      h.appendChild(a);
    }
    if (h.tagName === "H2") {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = "#" + h.id; a.textContent = h.firstChild.textContent;
      li.appendChild(a); toc.appendChild(li);
    }
  });
  if (toc.children.length) document.getElementById("toc").hidden = false;

  // Wide tables scroll sideways rather than the page.
  spec.querySelectorAll("table").forEach(t => {
    const w = document.createElement("div"); w.className = "table-wrap";
    t.parentNode.insertBefore(w, t); w.appendChild(t);
  });

  spec.querySelectorAll("pre code").forEach(c => hljs.highlightElement(c));
  if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
})();
</script>
</body>
</html>
